<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gloria POS | سیستم صندوق و دخل پرسنل گلوریا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #070a13; color: #f1f5f9; touch-action: manipulation; }
        .gold-grad { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .card-box { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .active-cat { background: #f59e0b !important; color: #000 !important; font-weight: 900; }
    </style>
</head>
<body class="p-2 sm:p-3 select-none flex flex-col min-h-screen">

    <!-- Top Bar -->
    <header class="card-box rounded-2xl px-3 py-2 flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl gold-grad flex items-center justify-center text-slate-950 font-black text-sm shadow">☕</div>
            <div>
                <h1 class="font-black text-xs sm:text-sm text-amber-400 leading-tight">GLORIA POS</h1>
                <p class="text-[9px] text-slate-400">صندوق فروش و ثبت سفارش پرسنل</p>
            </div>
        </div>

        <!-- گزارش سریع شیفت و دخل -->
        <div class="flex items-center gap-2 text-[10px]">
            <div class="bg-slate-800/80 px-2.5 py-1.5 rounded-xl border border-slate-700">
                <span class="text-slate-400">کارتخوان:</span>
                <span id="posTotal" class="font-bold text-sky-400 mr-1">۰</span>
            </div>
            <div class="bg-slate-800/80 px-2.5 py-1.5 rounded-xl border border-slate-700">
                <span class="text-slate-400">نقد:</span>
                <span id="cashTotal" class="font-bold text-emerald-400 mr-1">۰</span>
            </div>
            <div class="bg-amber-950/40 px-2.5 py-1.5 rounded-xl border border-amber-500/30">
                <span class="text-amber-300">کل دخل:</span>
                <span id="shiftTotal" class="font-black text-amber-400 mr-1">۰ ت</span>
            </div>
        </div>
    </header>

    <!-- Main Grid: منوی لمسی سمت راست، فاکتور جاری سمت چپ -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-2 flex-1">
        
        <!-- منو و انتخاب آیتم‌ها (سریع لمسی) -->
        <div class="md:col-span-8 flex flex-col gap-2">
            <!-- دسته‌بندی‌ها -->
            <div class="flex gap-1.5 overflow-x-auto custom-scroll pb-1">
                <button onclick="filterCat('all')" class="cat-btn active-cat bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-xl transition whitespace-nowrap">همه آیتم‌ها</button>
                <button onclick="filterCat('اسپرسو بار')" class="cat-btn bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-xl transition whitespace-nowrap">☕ اسپرسو بار</button>
                <button onclick="filterCat('سرد و تابستانه')" class="cat-btn bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-xl transition whitespace-nowrap">🧊 بار سرد</button>
                <button onclick="filterCat('کیک و دسر')" class="cat-btn bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-xl transition whitespace-nowrap">🍰 کیک و دسر</button>
                <button onclick="filterCat('ساندویچ و غذا')" class="cat-btn bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-xl transition whitespace-nowrap">🥪 اسنک و غذا</button>
            </div>

            <!-- گرید آیتم‌ها -->
            <div id="menuGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 overflow-y-auto custom-scroll max-h-[68vh] pr-0.5">
                <!-- آیتم‌ها از JS لود می‌شوند -->
            </div>
        </div>

        <!-- فاکتور و تسویه حساب (سمت پرسنل) -->
        <div class="md:col-span-4 card-box rounded-2xl p-3 flex flex-col justify-between h-full min-h-[500px]">
            <div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
                    <span class="font-bold text-xs text-amber-400 flex items-center gap-1">
                        <i class="fa-solid fa-receipt"></i> فاکتور جاری
                    </span>
                    <button onclick="clearCart()" class="text-[10px] text-rose-400 hover:text-rose-300 flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> پاک کردن
                    </button>
                </div>

                <!-- لیست خرید جاری -->
                <div id="cartItems" class="space-y-1.5 overflow-y-auto custom-scroll max-h-[220px] pr-1">
                    <div class="text-center text-slate-500 text-xs py-8">سفارشی انتخاب نشده</div>
                </div>
            </div>

            <!-- جمع و پرداخت -->
            <div class="border-t border-slate-800 pt-2 space-y-2 mt-2">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400">تعداد اقلام:</span>
                    <span id="cartCount" class="font-bold text-white">۰</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-300 font-bold">مبلغ کل:</span>
                    <span class="text-base font-black text-amber-400"><span id="cartTotal">۰</span> <span class="text-[10px] font-normal text-slate-400">تومان</span></span>
                </div>

                <!-- دکمه‌های تسویه حساب -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="checkout('pos')" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-lg shadow-sky-900/30">
                        <i class="fa-solid fa-credit-card"></i>
                        <span>پرداخت با کارتخوان</span>
                    </button>
                    <button onclick="checkout('cash')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-lg shadow-emerald-900/30">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <span>پرداخت نقدی</span>
                    </button>
                </div>

                <!-- آخرین فیش‌های ثبت شده شیفت -->
                <div class="pt-2">
                    <p class="text-[10px] text-slate-500 mb-1 flex items-center justify-between">
                        <span>آخرین سفارشات شیفت</span>
                        <span id="salesCount" class="text-amber-400 font-bold">۰ فیش</span>
                    </p>
                    <div id="recentOrders" class="space-y-1 max-h-[80px] overflow-y-auto custom-scroll text-[10px] text-slate-400"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://erqoumgshxtrpnyngtyg.supabase.co/rest/v1";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVycW91bWdzaHh0cnBueW5ndHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzgzMTksImV4cCI6MjA1NTc1NDMxOX0.eKq3o4Z476XUoZ4jI7f7dK6Y4Y3o4Z476XUoZ4jI7f7";

        // محصولات ثابت و منوی کافه
        const menuProducts = [
            { id: 1, name: "اسپرسو سینگل", category: "اسپرسو بار", price: 45000, icon: "☕" },
            { id: 2, name: "اسپرسو دبل", category: "اسپرسو بار", price: 55000, icon: "☕" },
            { id: 3, name: "آمریکانو", category: "اسپرسو بار", price: 65000, icon: "☕" },
            { id: 4, name: "کاپوچینو", category: "اسپرسو بار", price: 80000, icon: "🥛" },
            { id: 5, name: "لاته آرت", category: "اسپرسو بار", price: 85000, icon: "☕" },
            { id: 6, name: "موکا چاکلت", category: "اسپرسو بار", price: 95000, icon: "🍫" },
            { id: 7, name: "آیس لاته", category: "سرد و تابستانه", price: 90000, icon: "🧊" },
            { id: 8, name: "آیس آمریکانو", category: "سرد و تابستانه", price: 70000, icon: "🧊" },
            { id: 9, name: "شیک نوتلا", category: "سرد و تابستانه", price: 120000, icon: "🥤" },
            { id: 10, name: "شیک بادام زمینی", category: "سرد و تابستانه", price: 110000, icon: "🥤" },
            { id: 11, name: "کیک شکلاتی بی بی", category: "کیک و دسر", price: 75000, icon: "🍰" },
            { id: 12, name: "چیز کیک سن سباستین", category: "کیک و دسر", price: 95000, icon: "🧀" },
            { id: 13, name: "وافل ویژه گلوریا", category: "کیک و دسر", price: 130000, icon: "🧇" },
            { id: 14, name: "ساندویچ کلاب مرغ", category: "ساندویچ و غذا", price: 115000, icon: "🥪" },
            { id: 15, name: "کروسان بیکن و پنیر", category: "ساندویچ و غذا", price: 125000, icon: "🥐" }
        ];

        let cart = {};
        let currentFilter = 'all';
        let shiftSales = [];

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const items = currentFilter === 'all' ? menuProducts : menuProducts.filter(p => p.category === currentFilter);
            
            grid.innerHTML = items.map(p => `
                <div onclick="addToCart(${p.id})" class="card-box hover:border-amber-500/60 active:scale-95 transition cursor-pointer p-2.5 rounded-2xl flex flex-col justify-between h-24 bg-slate-900/90 shadow">
                    <div class="flex justify-between items-start">
                        <span class="text-xl">${p.icon}</span>
                        <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded-md">${p.category.split(' ')[0]}</span>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-slate-100 line-clamp-1">${p.name}</div>
                        <div class="text-[11px] font-black text-amber-400 mt-0.5">${p.price.toLocaleString('fa-IR')} ت</div>
                    </div>
                </div>
            `).join('');
        }

        function filterCat(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active-cat'));
            event.target.classList.add('active-cat');
            renderMenu();
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            renderCart();
        }

        function changeQty(id, delta) {
            if (!cart[id]) return;
            cart[id] += delta;
            if (cart[id] <= 0) delete cart[id];
            renderCart();
        }

        function clearCart() {
            cart = {};
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const keys = Object.keys(cart);
            let total = 0;
            let count = 0;

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 text-xs py-8">سفارشی انتخاب نشده</div>`;
            } else {
                container.innerHTML = keys.map(id => {
                    const item = menuProducts.find(p => p.id == id);
                    const qty = cart[id];
                    const itemTotal = item.price * qty;
                    total += itemTotal;
                    count += qty;

                    return `
                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-2 flex justify-between items-center text-xs">
                            <div class="flex-1">
                                <div class="font-bold text-slate-200">${item.name}</div>
                                <div class="text-[10px] text-amber-400 font-bold">${itemTotal.toLocaleString('fa-IR')} ت</div>
                            </div>
                            <div class="flex items-center gap-2 bg-slate-900 px-2 py-1 rounded-lg border border-slate-700">
                                <button onclick="changeQty(${item.id}, -1)" class="text-rose-400 font-bold px-1 text-sm">-</button>
                                <span class="font-black text-white text-xs">${qty.toLocaleString('fa-IR')}</span>
                                <button onclick="changeQty(${item.id}, 1)" class="text-emerald-400 font-bold px-1 text-sm">+</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('cartCount').innerText = count.toLocaleString('fa-IR');
            document.getElementById('cartTotal').innerText = total.toLocaleString('fa-IR');
        }

        async function checkout(method) {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('ابتدا آیتم‌های سفارش را انتخاب کنید.');
                return;
            }

            let total = 0;
            let orderTitle = [];
            keys.forEach(id => {
                const item = menuProducts.find(p => p.id == id);
                total += item.price * cart[id];
                orderTitle.push(`${item.name} (x${cart[id]})`);
            });

            const orderData = {
                customer_name: orderTitle.join(' + '),
                total_amount: total,
                status: 'completed',
                payment_method: method
            };

            // ذخیره در Supabase
            try {
                await fetch(`${API_URL}/sales_orders`, {
                    method: 'POST',
                    headers: {
                        'apikey': API_KEY,
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(orderData)
                });
            } catch (err) {
                console.log('ذخیره آفلاین');
            }

            // ثبت محلی در شیفت
            shiftSales.unshift({
                name: orderTitle.join(' + '),
                total: total,
                method: method,
                time: new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })
            });

            clearCart();
            updateShiftStats();
        }

        function updateShiftStats() {
            let pos = 0, cash = 0, total = 0;
            shiftSales.forEach(s => {
                total += s.total;
                if (s.method === 'pos') pos += s.total;
                else cash += s.total;
            });

            document.getElementById('posTotal').innerText = pos.toLocaleString('fa-IR') + ' ت';
            document.getElementById('cashTotal').innerText = cash.toLocaleString('fa-IR') + ' ت';
            document.getElementById('shiftTotal').innerText = total.toLocaleString('fa-IR') + ' ت';
            document.getElementById('salesCount').innerText = shiftSales.length.toLocaleString('fa-IR') + ' فیش';

            const recent = document.getElementById('recentOrders');
            recent.innerHTML = shiftSales.slice(0, 5).map(s => `
                <div class="flex justify-between items-center bg-slate-800/40 px-2 py-1 rounded">
                    <span class="truncate max-w-[140px] text-slate-300">${s.name}</span>
                    <span class="${s.method === 'pos' ? 'text-sky-400' : 'text-emerald-400'} font-bold">${s.total.toLocaleString('fa-IR')} ت</span>
                </div>
            `).join('');
        }

        renderMenu();
        renderCart();
    </script>
</body>
</html>
