<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کافه گلوریا | سیستم سفارش</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .card-glass { background: #151d30; border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- Header -->
    <header class="bg-slate-900/90 sticky top-0 z-50 px-4 py-3 border-b border-slate-800 flex justify-between items-center shadow-lg backdrop-blur">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl gold-gradient flex items-center justify-center text-slate-950 font-black text-xl shadow-md">
                ☕
            </div>
            <div>
                <h1 class="font-black text-base text-amber-400 leading-tight">Gloria Coffee Bar</h1>
                <p class="text-[11px] text-slate-400">کافه گلوریا • رودسر</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5 text-xs bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded-full text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-[11px] font-bold">فعال</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto p-4 space-y-4">
        
        <!-- Category Filter -->
        <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none" id="categoriesContainer">
            <button onclick="filterCat('all', this)" class="cat-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-amber-500 text-slate-950">همه</button>
            <button onclick="filterCat('اسپرسو بار', this)" class="cat-btn px-4 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300">اسپرسو بار</button>
            <button onclick="filterCat('سرد نوش', this)" class="cat-btn px-4 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300">سرد نوش</button>
            <button onclick="filterCat('بیکری', this)" class="cat-btn px-4 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300">بیکری و کیک</button>
        </div>

        <!-- Menu List -->
        <div id="menuContainer" class="space-y-3"></div>

    </main>

    <!-- Cart Floating Bar -->
    <div id="cartBar" class="fixed bottom-3 left-3 right-3 max-w-xl mx-auto bg-slate-900 border border-amber-500/40 p-3 rounded-2xl shadow-2xl flex justify-between items-center z-40 hidden">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold">
                <span id="cartCount">۰</span>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">جمع فاکتور</p>
                <p class="text-sm font-black text-amber-400"><span id="cartPrice">۰</span> تومان</p>
            </div>
        </div>
        <button onclick="openModal()" class="gold-gradient text-slate-950 px-4 py-2 rounded-xl font-black text-xs shadow-md">
            ثبت سفارش
        </button>
    </div>

    <!-- Modal -->
    <div id="orderModal" class="fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-amber-400 text-sm">ثبت نهایی سفارش</h3>
                <button onclick="closeModal()" class="text-slate-400 font-bold p-1">✕</button>
            </div>
            <div id="modalItems" class="space-y-2 max-h-48 overflow-y-auto text-xs"></div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">نام یا شماره میز:</label>
                <input type="text" id="custName" placeholder="مثال: آقای محمدی / بیرون‌بر" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
            </div>
            <div class="flex justify-between items-center pt-2 font-bold text-sm">
                <span>مبلغ نهایی:</span>
                <span class="text-amber-400"><span id="modalTotal">۰</span> تومان</span>
            </div>
            <button onclick="submitOrder()" id="btnSubmit" class="w-full gold-gradient text-slate-950 font-black py-2.5 rounded-xl text-sm shadow-md">
                ثبت سفارش ☕
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://erqoumgshxtrpnyngtyg.supabase.co/rest/v1";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVycW91bWdzaHh0cnBueW5ndHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzgzMTksImV4cCI6MjA1NTc1NDMxOX0.eKq3o4Z476XUoZ4jI7f7dK6Y4Y3o4Z476XUoZ4jI7f7";

        let menu = [
            { id: '1', name: 'اسپرسو سینگل', category: 'اسپرسو بار', price: 45000, description: '۱۰۰٪ عربیکا تخصصی' },
            { id: '2', name: 'اسپرسو دبل', category: 'اسپرسو بار', price: 55000, description: 'عصاره‌گیری استاندارد دبل شات' },
            { id: '3', name: 'امریکانو', category: 'اسپرسو بار', price: 60000, description: 'اسپرسو دبل همراه با آب جوش' },
            { id: '4', name: 'کاپوچینو', category: 'اسپرسو بار', price: 75000, description: 'اسپرسو، شیر بخار داده شده و فوم مخملی' },
            { id: '5', name: 'لاته آرت', category: 'اسپرسو بار', price: 80000, description: 'اسپرسو با بافت شیر ابریشمی' },
            { id: '6', name: 'کلد برو (دم‌سرد)', category: 'سرد نوش', price: 85000, description: 'عصاره‌گیری قطره‌ای سرد ۱۶ ساعته' },
            { id: '7', name: 'آیس لاته', category: 'سرد نوش', price: 85000, description: 'اسپرسو، شیر تازه خنک و یخ' },
            { id: '8', name: 'کوکی شکلات تلخ', category: 'بیکری', price: 40000, description: 'کوکی تازه پخت با چیپس شکلات بلژیکی' }
        ];

        let cart = {};
        let activeCat = 'all';

        // Fetch from Supabase via fast Direct REST API
        async function fetchMenuFromSupabase() {
            try {
                const res = await fetch(`${API_URL}/menu_items?select=*&order=created_at.asc`, {
                    headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        menu = data;
                        render();
                    }
                }
            } catch (e) {
                console.log("Using offline menu cache");
            }
        }

        function filterCat(category, btn) {
            activeCat = category;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = 'cat-btn px-4 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300';
            });
            btn.className = 'cat-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-amber-500 text-slate-950';
            render();
        }

        function render() {
            const container = document.getElementById('menuContainer');
            const filtered = activeCat === 'all' ? menu : menu.filter(i => i.category === activeCat);
            
            container.innerHTML = filtered.map(item => {
                const count = cart[item.id] ? cart[item.id].qty : 0;
                return `
                    <div class="card-glass rounded-2xl p-3.5 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-sm text-slate-100">${item.name}</h4>
                            <p class="text-[11px] text-slate-400">${item.description || ''}</p>
                            <p class="text-xs font-black text-amber-400 mt-1">${Number(item.price).toLocaleString('fa-IR')} تومان</p>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-900 border border-slate-700/80 rounded-xl p-1">
                            ${count > 0 ? `
                                <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-slate-800 text-rose-400 font-black text-sm">-</button>
                                <span class="w-4 text-center text-xs font-bold">${count.toLocaleString('fa-IR')}</span>
                            ` : ''}
                            <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 rounded-lg gold-gradient text-slate-950 font-black text-sm">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            updateCart();
        }

        function changeQty(id, change) {
            const item = menu.find(i => i.id == id);
            if (!item) return;

            if (!cart[id]) cart[id] = { ...item, qty: 0 };
            cart[id].qty += change;
            if (cart[id].qty <= 0) delete cart[id];
            render();
        }

        function updateCart() {
            const bar = document.getElementById('cartBar');
            let count = 0, price = 0;
            Object.values(cart).forEach(i => { count += i.qty; price += i.qty * i.price; });

            if (count > 0) {
                document.getElementById('cartCount').innerText = count.toLocaleString('fa-IR');
                document.getElementById('cartPrice').innerText = price.toLocaleString('fa-IR');
                bar.classList.remove('hidden');
            } else {
                bar.classList.add('hidden');
            }
        }

        function openModal() {
            const modal = document.getElementById('orderModal');
            const items = document.getElementById('modalItems');
            let total = 0;
            items.innerHTML = Object.values(cart).map(i => {
                const sub = i.qty * i.price;
                total += sub;
                return `<div class="flex justify-between bg-slate-800/70 p-2 rounded-lg"><span>${i.qty}× ${i.name}</span><span class="text-amber-400 font-bold">${sub.toLocaleString('fa-IR')} ت</span></div>`;
            }).join('');
            document.getElementById('modalTotal').innerText = total.toLocaleString('fa-IR');
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        async function submitOrder() {
            const btn = document.getElementById('btnSubmit');
            btn.innerText = 'در حال ثبت...';
            btn.disabled = true;

            const name = document.getElementById('custName').value || 'مشتری حضوری';
            let total = 0;
            Object.values(cart).forEach(i => total += i.qty * i.price);

            try {
                await fetch(`${API_URL}/sales_orders`, {
                    method: 'POST',
                    headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_name: name, total_amount: total, status: 'completed' })
                });
            } catch(e){}

            alert('سفارش با موفقیت ثبت شد! ☕✨');
            cart = {};
            closeModal();
            render();
            btn.innerText = 'ثبت سفارش ☕';
            btn.disabled = false;
        }

        // Run instantly
        render();
        fetchMenuFromSupabase();
    </script>
</body>
</html>
