<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Gloria Executive OS</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --card: #1a1a1a; --text: #f0f0f0; }
        body { background: var(--bg); color: var(--text); font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .nav { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--gold); }
        .btn { padding: 10px 20px; border: 1px solid var(--gold); border-radius: 8px; cursor: pointer; color: var(--gold); background: transparent; }
        .container { padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .manager-only { display: none; }
        input, select { background: #000; border: 1px solid var(--gold); color: white; padding: 5px; width: 100%; }
        h2 { color: var(--gold); }
    </style>
</head>
<body>

<div class="nav">
    <div onclick="showView('staff')">📦 فروش</div>
    <div onclick="showView('manager')">👑 مدیریت</div>
    <div id="clock">در حال بارگزاری...</div>
</div>

<!-- STAFF VIEW -->
<div id="staff-view" class="container">
    <h2>پیشخوان سفارشات</h2>
    <div class="grid" id="menu-grid">
        <!-- منو اینجا لود میشه -->
    </div>
    <div class="card" style="margin-top:20px;">
        <h3>سبد خرید</h3>
        <div id="cart-items">هیچ آیتمی نیست</div>
        <button class="btn" style="width:100%; margin-top:10px;" onclick="checkout()">ثبت نهایی</button>
    </div>
</div>

<!-- MANAGER VIEW -->
<div id="manager-view" class="container manager-only">
    <h2>اتاق فرمان مدیریت</h2>
    <div class="card">
        <p>مجموع فروش کل: <span id="total-sales">۰</span> تومان</p>
        <p>تعداد فاکتورها: <span id="total-orders">۰</span></p>
    </div>
    <button class="btn" style="margin-top:20px;" onclick="resetData()">پاکسازی دیتابیس</button>
</div>

<script>
    // تنظیمات اولیه
    let menu = [
        {id: 1, name: 'اسپرسو دبل', price: 60000},
        {id: 2, name: 'لته', price: 85000},
        {id: 3, name: 'کیک شکلاتی', price: 90000}
    ];

    let cart = [];

    function showView(view) {
        document.getElementById('staff-view').style.display = view === 'staff' ? 'block' : 'none';
        document.getElementById('manager-view').style.display = view === 'manager' ? 'block' : 'none';
    }

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('fa-IR');
    }
    setInterval(updateClock, 1000);

    function renderMenu() {
        const grid = document.getElementById('menu-grid');
        grid.innerHTML = menu.map(item => `
            <div class="card" onclick="addToCart(${item.id})">
                <h4>${item.name}</h4>
                <p>${item.price} ت</p>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const item = menu.find(i => i.id === id);
        cart.push(item);
        document.getElementById('cart-items').innerText = cart.length + ' آیتم در سبد';
    }

    function checkout() {
        let total = cart.reduce((sum, item) => sum + item.price, 0);
        let history = JSON.parse(localStorage.getItem('gloria_orders') || '[]');
        history.push({total, date: new Date()});
        localStorage.setItem('gloria_orders', JSON.stringify(history));
        cart = [];
        alert('سفارش ثبت شد!');
        updateStats();
    }

    function updateStats() {
        let history = JSON.parse(localStorage.getItem('gloria_orders') || '[]');
        let total = history.reduce((sum, o) => sum + o.total, 0);
        document.getElementById('total-sales').innerText = total;
        document.getElementById('total-orders').innerText = history.length;
    }

    function resetData() {
        localStorage.removeItem('gloria_orders');
        updateStats();
    }

    renderMenu();
    updateStats();
</script>
</body>
</html>
