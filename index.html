<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gloria Executive OS | کافه گلوریا</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #1e293b; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .brand { font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
        .badge { background: #059669; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.96); background: #334155; }
        .card h4 { font-size: 0.95rem; margin-bottom: 6px; color: #f1f5f9; }
        .card p { font-size: 0.85rem; color: #38bdf8; font-weight: bold; }
        .cart-panel { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        .cart-title { font-size: 1rem; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .cart-items { max-height: 180px; overflow-y: auto; margin-bottom: 12px; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        .btn-submit { width: 100%; background: #0284c7; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-submit:disabled { background: #475569; }
        .inventory-status { margin-top: 15px; background: #0f172a; padding: 10px; border-radius: 8px; font-size: 0.8rem; border: 1px solid #1e293b; }
        .inv-row { display: flex; justify-content: space-between; padding: 4px 0; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">☕ Gloria OS</div>
        <div class="badge" id="statusBadge">دیتابیس ابری آنلاین</div>
    </div>

    <div style="margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8;">منوی سفارش باریستا:</div>
    <div class="grid" id="menuGrid">
        <div style="grid-column: 1/-1; text-align: center; padding: 20px; color: #94a3b8;">در حال بارگذاری منو...</div>
    </div>

    <div class="cart-panel">
        <div class="cart-title">
            <span>سفارش جاری</span>
            <span id="totalPrice" style="color: #38bdf8; font-weight: bold;">۰ تومان</span>
        </div>
        <div class="cart-items" id="cartItems">
            <div style="text-align: center; color: #64748b; padding: 15px; font-size: 0.85rem;">آیتمی انتخاب نشده است</div>
        </div>
        <button class="btn-submit" id="btnSubmit" onclick="submitOrder()" disabled>ثبت نهایی و کسر از انبار</button>
    </div>

    <div class="inventory-status">
        <div style="font-weight: bold; margin-bottom: 6px; color: #e2e8f0;">📦 موجودی زنده انبار:</div>
        <div id="invList">در حال فراخوانی...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://erqoumgshxtrpnyngtyg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_KXB-s8EB4dDebYUyeOMb3A_s0Ep4U5I';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cart = [];
        let menuData = [];

        async function init() {
            await fetchMenu();
            await fetchInventory();
        }

        async function fetchMenu() {
            const { data, error } = await supabase.from('.innerHTML = data.map(i => `
                    <div class="inv-row">
                        <span>${i.name}</span>
                        <span>${Number(i.current_stock).toLocaleString('fa-IR')} ${i.unit}</span>
                    </div>
                `).join('');
            } el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `<h4>${item.name}</h4><p>${Number(item.price).toLocaleString('fa-IR')} ت</p>`;
                el.onclick = () => addToCart(item);
                grid.appendChild(el);
            });
        }

        async function fetchInventory() {
            const { data } = await supabase.from('inventory_items').select('*');
            if (data) {
                const list = document.getElementById('invList');
                list.innerHTML = data.map(i => `
                    <div class="inv-row">
                        <span>${i.name}</span>
                        <span>${Number(i.current_stock).toLocaleString('fa-IR')} ${i.unit}</span>
                    </div>
                `).join('');
            }
        }

        function addToCart(item) {
            cart.push(item);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cartItems');
            const totalEl = document.getElementById('totalPrice');
            const btn = document.getElementById('btnSubmit');

            if (cart.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #64748b; padding: 15px; font-size: 0.85rem;">آیتمی انتخاب نشده است</div>';
                totalEl.innerText = '۰ تومان';
                btn.disabled = true;
                return;
            }

            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += Number(item.price);
                return `
                    <div class="cart-row">
                        <span>${item.name}</span>
                        <span>${Number(item.price).toLocaleString('fa-IR')} ت <button style="background:none; border:none; color:#ef4444; margin-right:8px; cursor:pointer;" onclick="removeItem(${idx})">✕</button></span>
                    </div>
                `;
            }).join('');

            totalEl.innerText = total.toLocaleString('fa-IR') + ' تومان';
            btn.disabled = false;
        }

        function removeItem(idx) {
            cart.splice(idx, 1);
            renderCart();
        }

        async function submitOrder() {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = 'در حال ثبت سفارش و کسر انبار...';

            const total = cart.reduce((sum, item) => sum + Number(item.price), 0);

            const { data: order, error } = await supabase.from('orders').insert([{
                total_amount: total,
                status: 'completed',
                payment_method: 'card'
            }]).select();

            if (error) {
                alert('خطا: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'ثبت نهایی و کسر از انبار';
                return;
            }

            alert('✅ سفارش با موفقیت ثبت شد!');
            cart = [];
            renderCart();
            await fetchInventory();
            btn.innerText = 'ثبت نهایی و کسر از انبار';
        }

        init();
    </script>
</body>
</html>
