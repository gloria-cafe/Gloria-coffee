
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria OS - Takeaway Coffee POS</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #238636;
            --accent-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-gold: #f1e05a;
            --border: #30363d;
            --danger: #da3633;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        .title { font-size: 1.2rem; font-weight: bold; color: #58a6ff; }
        .badge { background: #238636; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; transition: transform 0.1s, border-color 0.2s; }
        .item-card:active { transform: scale(0.96); border-color: #58a6ff; }
        .item-name { font-weight: bold; margin-bottom: 6px; font-size: 0.95rem; }
        .item-price { color: var(--text-gold); font-size: 0.85rem; }
        .cart-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .cart-item span { color: var(--text-main); }
        .btn-checkout { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-checkout:active { background: var(--accent-hover); }
        .stock-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 0.85rem; }
        .stock-title { font-weight: bold; margin-bottom: 8px; color: #8b949e; }
        .stock-list { display: flex; gap: 15px; flex-wrap: wrap; }
        .stock-item { background: #0d1117; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); }
        .status-msg { text-align: center; color: #8b949e; padding: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Gloria OS ☕</div>
        <div class="badge" id="netStatus">متصل به دیتابیس</div>
    </div>

    <div style="font-size: 0.85rem; color: #8b949e; margin-bottom: 8px;">منوی سریع باریستا:</div>
    <div class="grid" id="menuGrid">
        <div class="status-msg">در حال دریافت منو...</div>
    </div>

    <div class="cart-box">
        <div class="cart-header">
            <div style="font-weight: bold;">سفارش جاری</div>
            <div id="cartTotal" style="color: #58a6ff; font-weight: bold;">۰ تومان</div>
        </div>
        <div id="cartList" style="min-height: 40px; margin-bottom: 12px;">
            <div style="color: #8b949e; font-size: 0.85rem; text-align: center; padding-top: 8px;">آیتمی انتخاب نشده است</div>
        </div>
        <button class="btn-checkout" id="submitBtn" onclick="checkoutOrder()">ثبت نهایی و کسر از انبار</button>
    </div>

    <div class="stock-box">
        <div class="stock-title">📦 موجودی زنده انبار:</div>
        <div class="stock-list" id="stockList">
            <div style="color: #8b949e;">در حال دریافت موجودی...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://erqoumgshxtrpnyngtyg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_KXB-s8EB4dDebYUyeOMb3A_s0Ep4U5I";

        let menuData = [];
        let stockData = [];
        let cart = {};

        async function apiReq(endpoint, method = 'GET', body = null) {
            const options = {
                method: method,
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=representation"
                }
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, options);
            if (!res.ok) throw new Error(await res.text());
            return await res.json();
        }

        async function initData() {
            try {
                menuData = await apiReq('menu_items?select=*');
                stockData = await apiReq('raw_materials?select=*');
                renderMenu();
                renderStock();
            } catch (err) {
                console.error(err);
                document.getElementById('menuGrid').innerHTML = `<div class="status-msg" style="color:#da3633">خطا در اتصال به Supabase: ${err.message}</div>`;
            }
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            if (!menuData.length) {
                grid.innerHTML = '<div class="status-msg">آیتمی در منو یافت نشد.</div>';
                return;
            }
            grid.innerHTML = menuData.map(item => `
                <div class="item-card" onclick="addToCart('${item.id}')">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${Number(item.price).toLocaleString('fa-IR')} ت</div>
                </div>
            `).join('');
        }

        function renderStock() {
            const stockDiv = document.getElementById('stockList');
            if (!stockData.length) {
                stockDiv.innerHTML = '<div style="color:#8b949e">موردی ثبت نشده.</div>';
                return;
            }
            stockDiv.innerHTML = stockData.map(m => `
                <div class="stock-item">
                    <span>${m.name}:</span> <strong>${Number(m.stock_quantity).toLocaleString('fa-IR')}</strong> ${m.unit}
                </div>
            `).join('');
        }

        function addToCart(itemId) {
            cart[itemId] = (cart[itemId] || 0) + 1;
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cartList');
            let total = 0;
            const itemsHtml = Object.keys(cart).map(id => {
                const item = menuData.find(m => m.id == id);
                if (!item) return '';
                const count = cart[id];
                const sum = item.price * count;
                total += sum;
                return `
                    <div class="cart-item">
                        <span>${item.name} (×${count})</span>
                        <span>${sum.toLocaleString('fa-IR')} تومان</span>
                    </div>
                `;
            }).join('');

            list.innerHTML = itemsHtml || '<div style="color: #8b949e; font-size: 0.85rem; text-align: center; padding-top: 8px;">آیتمی انتخاب نشده است</div>';
            document.getElementById('cartTotal').innerText = `${total.toLocaleString('fa-IR')} تومان`;
        }

        async function checkoutOrder() {
            const itemIds = Object.keys(cart);
            if (!itemIds.length) {
                alert('لطفاً ابتدا حداقل یک آیتم انتخاب کنید.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'در حال ثبت و کسر...';

            let total = 0;
            itemIds.forEach(id => {
                const item = menuData.find(m => m.id == id);
                if (item) total += item.price * cart[id];
            });

            try {
                // ثبت سفارش
                const orderRes = await apiReq('sales_orders', 'POST', { total_price: total });
                const orderId = orderRes[0].id;

                // ثبت اقلام سفارش
                for (let id of itemIds) {
                    const item = menuData.find(m => m.id == id);
                    await apiReq('sales_order_items', 'POST', {
                        order_id: orderId,
                        menu_item_id: item.id,
                        quantity: cart[id],
                        unit_price: item.price
                    });
                }

                alert('سفارش با موفقیت ثبت شد ✅');
                cart = {};
                updateCartUI();
                await initData();
            } catch (err) {
                alert('خطا در ثبت: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'ثبت نهایی و کسر از انبار';
            }
        }

        window.onload = initData;
    </script>
</body>
</html>
